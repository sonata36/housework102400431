{% extends "base.html" %}{% block title %}{{ '编辑论文' if paper else '新增论文' }}{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">PAPER RECORD</p><h1>{{ '编辑论文' if paper else '新增论文' }}</h1></div></div><form class="form panel" method="post"><label>标题<input required name="title" value="{{ paper.title if paper else '' }}"></label><div class="form-grid"><label>会议<select name="conference">{% for item in ['CVPR','ICCV','ECCV'] %}<option {% if paper and paper.conference==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>年份<input required type="number" name="year" value="{{ paper.year if paper else 2024 }}"></label><label>编号<input name="paper_number" value="{{ paper.paper_number if paper else '' }}"></label><label>作者<input name="authors" value="{{ paper.authors if paper else '' }}"></label></div><label>摘要<textarea name="abstract">{{ paper.abstract if paper else '' }}</textarea></label><label>作者关键词（逗号分隔）<input name="author_keywords" value="{{ paper.author_keywords|join(', ') if paper else '' }}"></label><label>自动抽取关键词（逗号分隔）<input name="extracted_keywords" value="{{ paper.extracted_keywords|join(', ') if paper else '' }}"></label><label>原文链接<input type="url" name="original_url" value="{{ paper.original_url if paper else '' }}"></label><label>数据来源<input name="source" value="{{ paper.source if paper else 'manual' }}"></label><div><button>保存论文</button> <a class="button secondary" href="{{ url_for('papers.list_page') }}">取消</a></div></form>{% endblock %}
