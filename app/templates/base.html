<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CV 顶会论文热点分析{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('pages.index') }}">CV 论文热点分析</a>
      <nav aria-label="主导航">
        <a href="{{ url_for('pages.index') }}">总览</a>
        <a href="{{ url_for('analytics.trends_page') }}">热度走势</a>
        <a href="{{ url_for('papers.list_page') }}">论文管理</a>
        <a href="{{ url_for('imports.import_page') }}">论文导入</a>
        <a href="{{ url_for('pages.about') }}">统计说明</a>
      </nav>
    </header>
    <main class="shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
