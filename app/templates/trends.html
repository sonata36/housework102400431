{% extends "base.html" %}{% block title %}热度走势{% endblock %}{% block head %}<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">TREND COMPARISON</p><h1>热度走势对比</h1><p class="muted">指标为关键词覆盖率；未举办、未采集、零出现分别保留状态。</p></div><span class="tag">原型数据/本地样本</span></div><section class="filterbar"><label>关键词<input id="trend-keyword" value="transformer"></label><label>会议（可多选）<select id="trend-conferences" multiple size="3"><option selected value="CVPR">CVPR</option><option selected value="ICCV">ICCV</option><option selected value="ECCV">ECCV</option></select></label><label>年份（逗号分隔）<input id="trend-years" value="2020,2021,2022,2023,2024"></label><button id="load-trend">更新图表</button><button id="replay-trend" class="secondary">重播</button><button id="pause-trend" class="secondary">暂停</button></section><section class="panel"><div id="trend-chart" class="chart"></div><p id="trend-status" class="notice"></p></section><p class="notice">数据不足时不插值；没有采集数据的年份不会被填成 0。</p><script src="{{ url_for('static', filename='js/trends.js') }}"></script>{% endblock %}
